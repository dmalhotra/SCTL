name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# a new push cancels the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04 # GCC 13.3, 14.2 (bug 117159)
          - macos-latest
        compiler:
          - g++-13
          - g++-14
          - clang++
        vecflag:
          - -march=native
        memdbgflag:
          - ""
          - -DSCTL_MEMDEBUG
        optflag:
          - -O0
          - -O3
        earlyra: # GCC 14 on Apple silicon: off adds -mearly-ra=none
          - "off"
        include:
          # GCC 14 with its early register allocator: tests the workarounds in the code
          - os: macos-latest
            compiler: g++-14
            vecflag: -march=native
            memdbgflag: ""
            optflag: -O3
            earlyra: "on"

    runs-on: ${{ matrix.os }}

    env:
      CPPFLAGS: >-
        -std=c++17 -g1 -rdynamic -fopenmp -Wall -Wfloat-conversion
        -DSCTL_GLOBAL_MEM_BUFF=500 -DSCTL_PROFILE=5 -DSCTL_VERBOSE
        -DSCTL_SIG_HANDLER -fstack-protector
      ASANFLAGS: >-
        -fsanitize=address,leak,undefined,pointer-compare,pointer-subtract,float-divide-by-zero,float-cast-overflow
        -fno-sanitize-recover=all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev g++-14

      - name: Setup dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc@13 gcc@14 llvm libomp
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=$CPPFLAGS -I$(brew --prefix llvm)/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix llvm)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: CPU
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "::notice::CPU: $(lscpu | sed -n 's/^Model name: *//p'); AVX-512: $(grep -q -w avx512f /proc/cpuinfo && echo yes || echo no)"
          else
            echo "::notice::CPU: $(sysctl -n machdep.cpu.brand_string)"
          fi

      - name: Build project
        run: |
          CXXFLAGS="${CPPFLAGS} ${{ matrix.optflag }} ${{ matrix.memdbgflag }}"
          if [ "$(uname -s)" == "Darwin" ] && [ "$(uname -m)" == "arm64" ]; then
            CXXFLAGS+=" -mcpu=apple-m1"
            if [[ "${{ matrix.compiler }}" == g++* ]]; then
              CXXFLAGS+=" -lomp" # clang's -fopenmp links libomp
            fi
            if [ "${{ matrix.compiler }}" == "g++-14" ] && [ "${{ matrix.earlyra }}" == "off" ]; then
              CXXFLAGS+=" -mearly-ra=none" # see README
            fi
          else
            CXXFLAGS+=" ${{ matrix.vecflag }} ${ASANFLAGS}"
          fi
          # __float128: x86, and GCC on Apple silicon
          if [ "$(uname -m)" == "x86_64" ] || [[ "${{ matrix.compiler }}" == g++* ]]; then
            CXXFLAGS+=" -DSCTL_QUAD_T=__float128"
          fi
          # one compile per core: the sanitizer builds of the largest tests come close to the runner's memory
          make -j$(getconf _NPROCESSORS_ONLN) CXX="${{ matrix.compiler }}" CXXFLAGS="${CXXFLAGS}"

      - name: Run tests
        run: bash .github/run-tests.sh

  # without sanitizers, which hid GCC bug 117159; x86-64-v4 under Intel SDE on runners without AVX-512
  release:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        compiler:
          - g++-13
          - g++-14
          - clang++
        isa:
          - x86-64-v3
          - x86-64-v4
        optflag:
          - -O2
          - -O3
        include:
          - {os: ubuntu-24.04, compiler: g++-12, isa: x86-64-v3, optflag: -O3}
          - {os: ubuntu-24.04, compiler: g++-12, isa: x86-64-v4, optflag: -O3}
          - {os: ubuntu-26.04, compiler: g++-15, isa: x86-64-v3, optflag: -O3}
          - {os: ubuntu-26.04, compiler: g++-15, isa: x86-64-v4, optflag: -O3}
          - {os: ubuntu-26.04, compiler: clang++-22, isa: x86-64-v3, optflag: -O3}
          - {os: ubuntu-26.04, compiler: clang++-22, isa: x86-64-v4, optflag: -O3}

    runs-on: ${{ matrix.os }}

    env:
      CPPFLAGS: >-
        -std=c++17 -g1 -rdynamic -fopenmp -Wall -Wfloat-conversion
        -DSCTL_GLOBAL_MEM_BUFF=500 -DSCTL_PROFILE=5 -DSCTL_VERBOSE
        -DSCTL_SIG_HANDLER -fstack-protector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup dependencies
        run: |
          sudo apt-get update
          c="${{ matrix.compiler }}"
          case "$c" in
            g++-*) sudo apt-get install -y libomp-dev "$c" ;;
            clang++-*) sudo apt-get install -y "clang-${c#clang++-}" "libomp-${c#clang++-}-dev" ;;
            *) sudo apt-get install -y libomp-dev ;;
          esac

      - name: CPU
        id: cpu
        run: |
          avx512=$(grep -q -w avx512f /proc/cpuinfo && echo yes || echo no)
          echo "::notice::CPU: $(lscpu | sed -n 's/^Model name: *//p'); AVX-512: ${avx512}"
          if [ "${{ matrix.isa }}" == "x86-64-v4" ] && [ "${avx512}" != "yes" ]; then
            echo "emulate=yes" >> $GITHUB_OUTPUT
            echo "::notice::No AVX-512 on this runner: test-vec runs under Intel SDE, which emulates it; the other tests are not run"
          fi

      # Intel SDE 10.13.1, checked against Intel's SHA256
      - name: Install Intel SDE
        if: steps.cpu.outputs.emulate == 'yes'
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/sde.tar.xz" https://media.githubusercontent.com/media/petarpetrovt/setup-sde/dfe773d77ce97b3da48d34ff9e6ff45a774ff4ff/binaries/sde-external-10.13.1-2026-07-28-lin.tar.xz
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  $RUNNER_TEMP/sde.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1

      - name: Build project
        run: |
          target=
          if [ "${{ steps.cpu.outputs.emulate }}" == "yes" ]; then
            target=bin/test-vec
          fi
          make -j$(getconf _NPROCESSORS_ONLN) ${target} CXX="${{ matrix.compiler }}" CXXFLAGS="${CPPFLAGS} ${{ matrix.optflag }} -march=${{ matrix.isa }} -DSCTL_QUAD_T=__float128"

      - name: Run tests
        run: |
          if [ "${{ steps.cpu.outputs.emulate }}" == "yes" ]; then
            SCTL_TESTS=test-vec SCTL_TEST_RUNNER="$RUNNER_TEMP/sde/sde64 -icx --" bash .github/run-tests.sh
          else
            bash .github/run-tests.sh
          fi
